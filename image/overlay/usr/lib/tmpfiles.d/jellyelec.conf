# JellyELEC first-boot and every-boot setup, run by systemd-tmpfiles.
# (/storage is already mounted when this runs.)

# p3i's built-in updater would replace JellyELEC with stock p3i. CoreELEC's settings
# add-on hides its Updates section while this marker exists.
f /dev/.update_disabled - - - -

# Skip CoreELEC's first-run wizard: JellyELEC's own setup takes its place.
# "C" copies the file only if it isn't there yet, so later changes are kept.
d /storage/.kodi/userdata/addon_data/service.coreelec.settings 0755 root root - -
C /storage/.kodi/userdata/addon_data/service.coreelec.settings/oe_settings.xml - - - - /usr/share/jellyelec/oe_settings.xml
